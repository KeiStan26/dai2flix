# ==============================================================================
# Apache2 VirtualHost Configuration for DAI2FLIX (dai2flix)
# Place at: /etc/apache2/sites-available/dai2flix.conf
#
# 【既存稼働サイト保護方針】
# 既存の "https://zyuuuukak1n.dev/" (/var/www/html/) に一切干渉しないよう、
# 独立したサブドメイン "dai2flix.zyuuuukak1n.dev" の名前ベースVirtualHostとして定義します。
# ==============================================================================

<VirtualHost *:80>
    ServerName dai2flix.zyuuuukak1n.dev
    ServerAdmin webmaster@localhost

    # --------------------------------------------------------------------------
    # Document Root (Frontend Vite Production Build)
    # --------------------------------------------------------------------------
    DocumentRoot /var/www/dai2flix/dist

    <Directory /var/www/dai2flix/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA Routing: Route all non-file requests to index.html
        FallbackResource /index.html
    </Directory>

    # --------------------------------------------------------------------------
    # Reverse Proxy to FastAPI Backend (Uvicorn on 127.0.0.1:8000)
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # Forward API requests to FastAPI backend
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Optional: Forward API documentation
    ProxyPass /docs http://127.0.0.1:8000/docs
    ProxyPassReverse /docs http://127.0.0.1:8000/docs
    ProxyPass /openapi.json http://127.0.0.1:8000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

    # --------------------------------------------------------------------------
    # Strict Defensive Security: Block all sensitive files
    # --------------------------------------------------------------------------
    <FilesMatch "(^\.env|\.db$|\.sqlite3$|\.git|\.lock$|requirements\.txt$)">
        Require all denied
    </FilesMatch>

    # Block access to hidden files and directories
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # --------------------------------------------------------------------------
    # Performance & Compression (mod_deflate)
    # --------------------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # --------------------------------------------------------------------------
    # Logging Configuration (Completely separated from existing sites)
    # --------------------------------------------------------------------------
    ErrorLog ${APACHE_LOG_DIR}/dai2flix_error.log
    CustomLog ${APACHE_LOG_DIR}/dai2flix_access.log combined
</VirtualHost>
